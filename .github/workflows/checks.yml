name: Source checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-15
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, verified 2026-10-15
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - run: npm ci --no-fund
      - run: npm run github:test
      - run: npm run github:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run architecture:test
      - run: npm run assistant:test
      - run: npm run audio:test
      - run: npm run security:audit
      - run: npm run build -- --production
      - run: npm run test:coverage
      - name: Check basic desktop behavior without an SDK
        run: npx playwright test tests/e2e/launch-motivation.spec.ts tests/e2e/managed-manual.spec.ts tests/e2e/desktop-shell.spec.ts tests/e2e/reading-keyboard-scale.spec.ts
